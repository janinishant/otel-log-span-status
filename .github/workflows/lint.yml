name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[lint,test]'
      - name: Pylint src
        run: pylint src
      # Test names describe themselves, and pytest fixtures trip redefined-outer-name.
      - name: Pylint tests
        run: >
          pylint tests
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring,redefined-outer-name
