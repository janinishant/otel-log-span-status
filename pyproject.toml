[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otel-log-span-status"
version = "0.1.0"
description = "Mark the active OpenTelemetry span as ERROR when an error-level log is emitted, with a YAML ignore list."
requires-python = ">=3.9"
dependencies = [
    "opentelemetry-api>=1.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "opentelemetry-sdk>=1.20",
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otel_log_span_status"]
